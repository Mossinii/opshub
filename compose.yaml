services:
  opshub:
    build:
      context: .
    image: opshub:local
    container_name: opshub-local
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_NAME: "${APP_NAME:-opshub}"
      APP_ENV: "${APP_ENV:-compose}"
      APP_PORT: "8000"

  prometheus:
    image: prom/prometheus:latest
    container_name: opshub-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - opshub
